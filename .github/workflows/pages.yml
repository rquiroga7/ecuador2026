name: Deploy dashboard (GitHub Pages)

# Publica el sitio estático de `web/` (index.html, config.js, datos_web.json y los
# GeoJSON) en GitHub Pages. No hay build: es HTML/JS puro.
#
# Activar una vez en: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar el sitio (`web/`)
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Desplegar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
